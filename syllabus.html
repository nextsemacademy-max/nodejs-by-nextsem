<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Interactive Syllabus - NextSem Staging</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-color: #0b0f19;
      --card-bg: #151d30;
      --primary: #10b981;
      --primary-rgb: 16, 185, 129;
      --text: #f3f4f6;
      --text-muted: #9ca3af;
      --border: rgba(255, 255, 255, 0.06);
      --header-bg: rgba(17, 24, 39, 0.85);
      --font-sans: 'Inter', sans-serif;
      --font-heading: 'Outfit', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text);
      font-family: var(--font-sans);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* --- Frosted Header --- */
    .header {
      background-color: var(--header-bg);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .title-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .title {
      font-family: var(--font-heading);
      font-size: 1.3rem;
      font-weight: 700;
      background: linear-gradient(135deg, #10b981, #60a5fa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .badge {
      background-color: rgba(16, 185, 129, 0.15);
      color: var(--primary);
      border: 1px solid rgba(16, 185, 129, 0.3);
      font-size: 0.7rem;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 9999px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .back-btn {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 500;
      transition: color 0.2s;
    }

    .back-btn:hover {
      color: var(--text);
    }

    /* --- Page Container --- */
    .container {
      max-width: 1200px;
      width: 100%;
      margin: 0 auto;
      padding: 30px 24px;
      display: flex;
      flex-direction: column;
      gap: 30px;
    }

    /* --- Hero Section --- */
    .hero {
      text-align: center;
      max-width: 700px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .hero h1 {
      font-family: var(--font-heading);
      font-size: 2.2rem;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .hero p {
      color: var(--text-muted);
      font-size: 1rem;
      line-height: 1.6;
    }

    /* --- Filter Controls --- */
    .controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 20px;
    }

    .tabs {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: none;
    }

    .tabs::-webkit-scrollbar {
      display: none;
    }

    .tab-btn {
      background-color: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      font-family: var(--font-heading);
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      white-space: nowrap;
    }

    .tab-btn:hover {
      color: var(--text);
      background-color: rgba(255, 255, 255, 0.05);
    }

    .tab-btn.active {
      color: #fff;
      border-color: transparent;
    }

    /* Category Specific Active Gradients */
    .tab-btn[data-category="all"].active { background: linear-gradient(135deg, #10b981, #059669); }
    .tab-btn[data-category="foundations"].active { background: linear-gradient(135deg, #0d9488, #059669); }
    .tab-btn[data-category="networking"].active { background: linear-gradient(135deg, #0284c7, #2563eb); }
    .tab-btn[data-category="security"].active { background: linear-gradient(135deg, #7c3aed, #c026d3); }
    .tab-btn[data-category="advanced"].active { background: linear-gradient(135deg, #d97706, #ea580c); }

    /* Search Bar */
    .search-wrapper {
      position: relative;
      width: 280px;
    }

    .search-input {
      width: 100%;
      background-color: rgba(0, 0, 0, 0.2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 12px 8px 36px;
      color: var(--text);
      font-size: 0.85rem;
      outline: none;
      transition: all 0.2s;
    }

    .search-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 10px rgba(16, 185, 129, 0.15);
    }

    .search-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      width: 14px;
      height: 14px;
      fill: var(--text-muted);
      pointer-events: none;
    }

    /* --- Syllabus Grid --- */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 20px;
    }

    /* --- Card Style --- */
    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 4px;
      height: 100%;
    }

    /* Category Indicators */
    .card[data-category="foundations"]::before { background: linear-gradient(to bottom, #0d9488, #059669); }
    .card[data-category="networking"]::before { background: linear-gradient(to bottom, #0284c7, #2563eb); }
    .card[data-category="security"]::before { background: linear-gradient(to bottom, #7c3aed, #c026d3); }
    .card[data-category="advanced"]::before { background: linear-gradient(to bottom, #d97706, #ea580c); }

    .card:hover {
      transform: translateY(-6px);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.3);
      border-color: rgba(255, 255, 255, 0.12);
    }

    .card-hdr {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .mod-num {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .card[data-category="foundations"] .mod-num { color: #0d9488; }
    .card[data-category="networking"] .mod-num { color: #38bdf8; }
    .card[data-category="security"] .mod-num { color: #a78bfa; }
    .card[data-category="advanced"] .mod-num { color: #fbbf24; }

    .mod-title {
      font-family: var(--font-heading);
      font-size: 1.15rem;
      font-weight: 700;
      margin-top: 4px;
    }

    .mod-metaphor {
      font-size: 0.85rem;
      color: var(--text-muted);
      line-height: 1.5;
    }

    .mod-metaphor strong {
      color: var(--text);
    }

    /* Accordion Steps */
    .steps-accordion {
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      background-color: rgba(0, 0, 0, 0.15);
    }

    .accordion-toggle {
      width: 100%;
      background: none;
      border: none;
      color: var(--text);
      font-family: var(--font-heading);
      font-size: 0.8rem;
      font-weight: 600;
      padding: 10px 14px;
      text-align: left;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .accordion-toggle svg {
      width: 12px;
      height: 12px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2.5;
      transition: transform 0.2s;
    }

    .steps-accordion.active .accordion-toggle svg {
      transform: rotate(180deg);
    }

    .accordion-content {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.25s ease-out;
    }

    .steps-accordion.active .accordion-content {
      max-height: 400px;
      border-top: 1px solid var(--border);
    }

    .step-item {
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      border-bottom: 1px solid var(--border);
    }

    .step-item:last-child {
      border-bottom: none;
    }

    .step-label {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--primary);
    }

    .step-desc {
      font-size: 0.8rem;
      color: var(--text-muted);
      line-height: 1.4;
    }

    .step-code {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      color: #34d399;
      background-color: rgba(0, 0, 0, 0.3);
      padding: 4px 8px;
      border-radius: 4px;
      border: 1px solid rgba(255, 255, 255, 0.03);
      word-break: break-all;
    }

    /* Case Study Panel */
    .case-study {
      background-color: rgba(96, 165, 250, 0.03);
      border: 1px solid rgba(96, 165, 250, 0.1);
      border-radius: 10px;
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .case-title {
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      color: #60a5fa;
      letter-spacing: 0.05em;
    }

    .case-text {
      font-size: 0.8rem;
      color: var(--text-muted);
      line-height: 1.4;
    }

    /* Launch Button */
    .launch-btn {
      width: 100%;
      border: none;
      padding: 10px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      font-family: var(--font-heading);
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
      text-decoration: none;
    }

    .launch-btn.active {
      background-color: var(--primary);
      color: #fff;
    }

    .launch-btn.active:hover {
      background-color: #059669;
    }

    .launch-btn.locked {
      background-color: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--border);
      color: var(--text-muted);
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header class="header">
    <div class="title-group">
      <!-- SVG Logo Icon -->
      <svg class="logo-icon" viewBox="0 0 84 64" fill="none" stroke="#10b981" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" style="width:32px;height:24px;flex-shrink:0;">
        <path d="M 16 52 L 16 26 C 16 17.5 22.5 11 30.5 11 C 38.5 11 45 17.5 45 26 L 45 42 C 45 48 49 53 56 53 C 63 53 67 48 67 42 C 67 36 63 32 56 32 C 49 32 45 28 45 22 C 45 16 49 11 56 11 C 63 11 67 16 67 22" />
      </svg>
      <div class="title" style="color: #ffffff; font-family: var(--font-sans); font-weight: 800; font-size: 1.15rem; display: flex; flex-direction: column; line-height: 1.1; margin-right: 8px;">
        <span style="font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.05em; color: #10b981; font-weight: 700;">Node.js by</span>
        <span>NextSem</span>
      </div>
      <span class="badge">Syllabus Grid</span>
    </div>
    <a href="lessons.html" class="back-btn">Exit</a>
  </header>

  <div class="container">
    <!-- Hero -->
    <div class="hero">
      <h1>Master Node.js with Bubu & Dudu</h1>
      <p>Explore the full 25-module interactive curriculum. Walk through metaphors, expand coding milestones, and learn how top engineering teams deploy these APIs in the real world.</p>
    </div>

    <!-- Controls -->
    <div class="controls">
      <div class="tabs">
        <button class="tab-btn active" data-category="all" onclick="filterCategory('all')">All Modules</button>
        <button class="tab-btn" data-category="foundations" onclick="filterCategory('foundations')">Foundations</button>
        <button class="tab-btn" data-category="networking" onclick="filterCategory('networking')">Networking</button>
        <button class="tab-btn" data-category="security" onclick="filterCategory('security')">Security & Production</button>
        <button class="tab-btn" data-category="advanced" onclick="filterCategory('advanced')">Advanced Architecture</button>
      </div>

      <div class="search-wrapper">
        <svg class="search-icon" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
        <input type="text" id="search-bar" class="search-input" placeholder="Search modules..." oninput="handleSearch(this.value)">
      </div>
    </div>

    <!-- Grid -->
    <main class="grid" id="syllabus-grid">
      <!-- Cards will be dynamically injected here -->
    </main>
  </div>

  <script>
    // --- Syllabus Data (25 Modules) ---
    const syllabusData = [
      {
        id: "hello-world",
        num: "Module 01",
        title: "Hello World Environment",
        category: "foundations",
        metaphor: "Bubu & Dudu turn on the lights in the restaurant.",
        steps: [
          { num: 1, desc: "Log a welcoming kitchen greeting.", code: "console.log('Kitchen open! 🍽️');" },
          { num: 2, desc: "Check which OS operating platform they are standing on.", code: "process.platform;" },
          { num: 3, desc: "Verify the running model version of their cooker oven.", code: "process.version;" }
        ],
        caseStudy: "PayPal uses server check tasks on bootstrap to verify that runtimes are healthy.",
        launchId: "http-server", // Default launch target for demo
        isSupported: true
      },
      {
        id: "modules",
        num: "Module 02",
        title: "Working with Modules",
        category: "foundations",
        metaphor: "Dudu prepares mathematical helper recipes to share with Bubu.",
        steps: [
          { num: 1, desc: "Export helper variables via CommonJS exports.", code: "exports.add = (a, b) => a + b;" },
          { num: 2, desc: "Require local mathematical module in main scope.", code: "const math = require('./math');" },
          { num: 3, desc: "Run math additions and log calculation.", code: "console.log(math.add(5, 10));" }
        ],
        caseStudy: "LinkedIn divides profile feeds, filters, and notification files into reusable modules.",
        launchId: "custom-modules",
        isSupported: true
      },
      {
        id: "event-loop",
        num: "Module 03",
        title: "Event Loop & Async I/O",
        category: "foundations",
        metaphor: "Bubu takes orders while Dudu bakes behind the scenes, preventing lines.",
        steps: [
          { num: 1, desc: "Set dessert baking timer to run asynchronously.", code: "setTimeout(bakeCake, 2000);" },
          { num: 2, desc: "Register a log message instantly to show non-blocking capacity.", code: "console.log('Order logged!');" },
          { num: 3, desc: "Queue a beverage delivery step instantly using setImmediate.", code: "setImmediate(serveDrinks);" }
        ],
        caseStudy: "Uber uses asynchronous loops to manage live coordinate updates from millions of rides.",
        isSupported: false
      },
      {
        id: "paths",
        num: "Module 04",
        title: "Paths & Folder Navigation",
        category: "foundations",
        metaphor: "Mapping pantry cupboard rows to locate spices on any OS cabinet system.",
        steps: [
          { num: 1, desc: "Load the path compiler utility module.", code: "const path = require('path');" },
          { num: 2, desc: "Cross-join path names using os-agnostic directory rules.", code: "const file = path.join('shelf', 'salt.txt');" },
          { num: 3, desc: "Scan file extensions to ensure correct packaging.", code: "path.extname(file);" }
        ],
        caseStudy: "Slack matches assets and local files dynamically across desktop installations.",
        isSupported: false
      },
      {
        id: "fs-read",
        num: "Module 05",
        title: "File System (Reading Files)",
        category: "foundations",
        metaphor: "Bubu reading a text file recipe book on the kitchen counter.",
        steps: [
          { num: 1, desc: "Require the core filesystem fs helper library.", code: "const fs = require('fs');" },
          { num: 2, desc: "Read recipe text file synchronously.", code: "const data = fs.readFileSync('recipe.txt', 'utf8');" },
          { num: 3, desc: "Log file details directly onto console screen.", code: "console.log(data);" }
        ],
        caseStudy: "Figma loads server setups and dynamic layouts into memory during cold boots.",
        launchId: "fs-read",
        isSupported: true
      },
      {
        id: "fs-write",
        num: "Module 06",
        title: "File System (Writing Files)",
        category: "foundations",
        metaphor: "Dudu logging a new strawberry dessert recipe onto the parchment paper sheet.",
        steps: [
          { num: 1, desc: "Load the fs module from node core.", code: "const fs = require('fs');" },
          { num: 2, desc: "Write text data synchronously into file storage.", code: "fs.writeFileSync('new.txt', 'Strawberry Cake');" },
          { num: 3, desc: "Check if the newly created recipe file exists on the shelf.", code: "fs.existsSync('new.txt');" }
        ],
        caseStudy: "Ghost CMS outputs draft pages and blogs directly onto server disks.",
        isSupported: false
      },
      {
        id: "os-process",
        num: "Module 07",
        title: "OS Process Metrics",
        category: "foundations",
        metaphor: "Bubu reading kitchen thermometers to check process health parameters.",
        steps: [
          { num: 1, desc: "Measure current operating memory constraints.", code: "os.freemem();" },
          { num: 2, desc: "Inspect variables set in process environments.", code: "process.env;" },
          { num: 3, desc: "Log system process ID of current runner.", code: "console.log(process.pid);" }
        ],
        caseStudy: "AWS EC2 scale policies watch memory metrics to trigger hot reboots.",
        isSupported: false
      },
      {
        id: "http-server",
        num: "Module 08",
        title: "HTTP Servers",
        category: "networking",
        metaphor: "Assembling a central hot stove where customers submit food orders.",
        steps: [
          { num: 1, desc: "Import the http client module wrapper.", code: "const http = require('http');" },
          { num: 2, desc: "Create a listener server constructor.", code: "const server = http.createServer();" },
          { num: 3, desc: "Bind the stove server port connection to 3000.", code: "server.listen(3000);" }
        ],
        caseStudy: "PayPal uses HTTP listener servers to receive checkout orders.",
        launchId: "http-server",
        isSupported: true
      },
      {
        id: "streams",
        num: "Module 09",
        title: "Streams (Reading Chunks)",
        category: "networking",
        metaphor: "Flour feeding through conveyor belts instead of lifting a heavy sack.",
        steps: [
          { num: 1, desc: "Import the filesystem module library.", code: "const fs = require('fs');" },
          { num: 2, desc: "Create readable streams referencing large files.", code: "const read = fs.createReadStream('large_flour.txt');" },
          { num: 3, desc: "Catch incoming chunks on data event triggers.", code: "read.on('data', chunk => {});" }
        ],
        caseStudy: "Netflix routes video files as packet flows to stop memory starvation.",
        isSupported: false
      },
      {
        id: "piping",
        num: "Module 10",
        title: "Piping Streams",
        category: "networking",
        metaphor: "Fitting plumbing tubes to run soup directly from Dudu's pot into bowls.",
        steps: [
          { num: 1, desc: "Create readable data stream channel from soup pot.", code: "const read = fs.createReadStream('soup.txt');" },
          { num: 2, desc: "Create writable output file connection to bowl.", code: "const write = fs.createWriteStream('bowl.txt');" },
          { num: 3, desc: "Pipe readable stream into writable stream directly.", code: "read.pipe(write);" }
        ],
        caseStudy: "Dropbox channels files from client sockets directly to physical disks.",
        isSupported: false
      },
      {
        id: "events",
        num: "Module 11",
        title: "Event Emitters",
        category: "networking",
        metaphor: "Ringing bells at delivery windows whenever chefs complete cooking.",
        steps: [
          { num: 1, desc: "Instantiate an EventEmitter emitter object.", code: "const bell = new EventEmitter();" },
          { num: 2, desc: "Attach ring listeners pointing to serveFood routines.", code: "bell.on('ring', serveFood);" },
          { num: 3, desc: "Emit trigger alerts on completed preparation events.", code: "bell.emit('ring');" }
        ],
        caseStudy: "Trello updates boards live whenever cards shift between progress columns.",
        isSupported: false
      },
      {
        id: "express",
        num: "Module 12",
        title: "Express.js Routing",
        category: "networking",
        metaphor: "Hostesses guiding restaurant diners to separate tables based on menu requests.",
        steps: [
          { num: 1, desc: "Require express framework and construct app.", code: "const app = express();" },
          { num: 2, desc: "Create request path routes handling page views.", code: "app.get('/menu', sendMenu);" },
          { num: 3, desc: "Open server router ports to receive connections.", code: "app.listen(8080);" }
        ],
        caseStudy: "eBay routes search queries, product views, and cards across specialized web pages.",
        isSupported: false
      },
      {
        id: "middleware",
        num: "Module 13",
        title: "Express Middleware",
        category: "networking",
        metaphor: "Checking employee hand hygiene before letting them handle food.",
        steps: [
          { num: 1, desc: "Draft middleware functions with request, response, and next arguments.", code: "const wash = (req,res,next)=>next();" },
          { num: 2, desc: "Apply middleware globally using app.use.", code: "app.use(wash);" },
          { num: 3, desc: "Call next() callback to continue request flow.", code: "next();" }
        ],
        caseStudy: "Medium monitors user authorization values before showing full premium content.",
        isSupported: false
      },
      {
        id: "json-parsing",
        num: "Module 14",
        title: "JSON Request Parsing",
        category: "networking",
        metaphor: "Parsing custom order forms filled out by customers to customize dishes.",
        steps: [
          { num: 1, desc: "Mount express JSON parser middleware.", code: "app.use(express.json());" },
          { num: 2, desc: "Send response payload objects as parsed JSON.", code: "res.json({dish: 'burger'});" },
          { num: 3, desc: "Access variable fields on parsed request bodies.", code: "const name = req.body.name;" }
        ],
        caseStudy: "Tinder routes geolocation objects and matches across user database records.",
        isSupported: false
      },
      {
        id: "mongodb",
        num: "Module 15",
        title: "Database Integration",
        category: "networking",
        metaphor: "Cataloging ingredients in the stock walk-in freezer vault.",
        steps: [
          { num: 1, desc: "Load mongo client constructor libraries.", code: "const client = require('mongodb').MongoClient;" },
          { num: 2, desc: "Connect databases to server connections.", code: "await client.connect();" },
          { num: 3, desc: "Write record logs directly into database collections.", code: "db.collection('menu').insertOne(item);" }
        ],
        caseStudy: "Forbes compiles stories, drafts, and author details dynamically.",

    // --- Filter Category ---
    let activeFilter = 'all';
    let searchQuery = '';

    function filterCategory(categoryName) {
      activeFilter = categoryName;
      
      // Update active tabs
      document.querySelectorAll('.tab-btn').forEach((btn) => {
        if (btn.getAttribute('data-category') === categoryName) {
          btn.classList.add('active');
        } else {
          btn.classList.remove('active');
        }
      });
      
      renderGrid();
    }

    // --- Search Input handler ---
    function handleSearch(val) {
      searchQuery = val.trim().toLowerCase();
      renderGrid();
    }

    // --- Accordion Toggle ---
    function toggleAccordion(element) {
      const parent = element.parentElement;
      parent.classList.toggle('active');
    }

    // --- Render Grid ---
    function renderGrid() {
      const grid = document.getElementById('syllabus-grid');
      grid.innerHTML = '';

      const filtered = syllabusData.filter((card) => {
        // Category check
        if (activeFilter !== 'all' && card.category !== activeFilter) {
          return false;
        }
        // Search check
        if (searchQuery) {
          const matchTitle = card.title.toLowerCase().includes(searchQuery);
          const matchMetaphor = card.metaphor.toLowerCase().includes(searchQuery);
          const matchCase = card.caseStudy.toLowerCase().includes(searchQuery);
          return matchTitle || matchMetaphor || matchCase;
        }
        return true;
      });

      filtered.forEach((card) => {
        const div = document.createElement('div');
        div.className = 'card';
        div.setAttribute('data-category', card.category);

        // Steps HTML
        let stepsHTML = '';
        card.steps.forEach((step) => {
          stepsHTML += `
            <div class="step-item">
              <div class="step-label">Step ${step.num}</div>
              <div class="step-desc">${step.desc}</div>
              <div class="step-code">${step.code}</div>
            </div>
          `;
        });

        // Launch Button HTML
        let launchBtnHTML = '';
        if (card.isSupported) {
          launchBtnHTML = `<a href="interactive-notebook.html?lesson=${card.launchId}" class="launch-btn active">Launch Lesson 🚀</a>`;
        } else {
          launchBtnHTML = `<button class="launch-btn locked" disabled>Coming Soon 🔒</button>`;
        }

        div.innerHTML = `
          <div class="card-hdr">
            <span class="mod-num">${card.num}</span>
            <span class="badge" style="font-size: 0.6rem; padding: 1px 6px;">${card.category}</span>
          </div>
          <div>
            <h3 class="mod-title">${card.title}</h3>
          </div>
          <p class="mod-metaphor"><strong>Metaphor:</strong> ${card.metaphor}</p>

          <!-- Accordion -->
          <div class="steps-accordion">
            <button class="accordion-toggle" onclick="toggleAccordion(this)">
              Show Coding Steps
              <svg viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"></polyline></svg>
            </button>
            <div class="accordion-content">
              ${stepsHTML}
            </div>
          </div>

          <!-- Case Study -->
          <div class="case-study">
            <span class="case-title">Real-World Case Study</span>
            <p class="case-text">${card.caseStudy}</p>
          </div>

          ${launchBtnHTML}
        `;
        grid.appendChild(div);
      });
    }

    // Initial render
    renderGrid();
  </script>
