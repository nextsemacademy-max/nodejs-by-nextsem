  <script>document.documentElement.style.setProperty('--real-vh', window.innerHeight + 'px');</script>
  <style>
    /* ── Navbar ── */
    .lessons-navbar{background:rgba(10,14,19,.96)!important;backdrop-filter:blur(15px);border-bottom:1px solid var(--border);position:sticky!important;top:0!important;left:0!important;transform:none!important;width:100%!important;max-width:100%!important;z-index:100;padding:0 1rem!important}
    .lessons-navbar .nav-container{width:100%!important;display:flex!important;align-items:center!important;justify-content:space-between!important;gap:0!important;height:56px!important;position:relative}
    .nav-back-btn{color:var(--text-secondary);display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.02);border:1px solid var(--border);z-index:2;text-decoration:none;cursor:pointer;transition:background .2s}
    .nav-back-btn:hover{background:rgba(255,255,255,.06);color:var(--text-primary)}
    .nav-page-title{position:absolute;left:50%;transform:translateX(-50%);font-size:.98rem;font-weight:800;color:var(--text-primary);pointer-events:none;z-index:1;white-space:nowrap}
    .lessons-navbar .nav-actions{display:flex;align-items:center;gap:.5rem;z-index:2}
    .lessons-navbar .btn-auth{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:50%;padding:0;border:1px solid var(--border)}

    /* ── Reset app-container padding ── */
    .app-container { padding-top: 0 !important; padding-bottom: 0 !important; }

    /* ── View-list: use position:fixed so no viewport math needed ── */
    /* This is immune to 100vh bugs on all mobile browsers */
    #view-list {
      position: fixed;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 480px;
      bottom: 60px; /* exact bottom nav height */
      display: flex;
      flex-direction: column;
      overflow: auto;
      padding: 0 !important;
      z-index: 10;
    }
    .lh { display: none; }

    /* ── Track Filter Tab Strip ── */
    .track-filter-strip { flex-shrink:0; display:flex; gap:0.5rem; padding:0.65rem 1rem 0.55rem; overflow-x:auto; scrollbar-width:none; background:var(--bg-dark); border-bottom:1px solid var(--border); z-index:90; }
    .track-filter-strip::-webkit-scrollbar { display: none; }
    .tft { flex-shrink:0; padding:0.35rem 0.9rem; font-size:0.8rem; font-weight:700; border-radius:99px; border:1px solid var(--border); background:rgba(255,255,255,0.03); color:var(--text-secondary); cursor:pointer; transition:all 0.18s; white-space:nowrap; }
    .tft:hover { border-color:rgba(104,160,99,0.3); color:var(--node-green); }
    .tft.active { background:var(--node-green); border-color:var(--node-green); color:#fff; box-shadow:0 2px 10px rgba(104,160,99,0.35); }

    /* ══ INSHORTS SWIPE CONTAINER ══ */
    .swipe-container { flex:1; position:relative; overflow:hidden; min-height:0; background:var(--bg-dark); touch-action:none; }
    .swipe-card { position:absolute; inset:0; display:flex; flex-direction:column; background:var(--bg-dark); will-change:transform; transition:transform 0.38s cubic-bezier(0.16, 1, 0.3, 1); overflow:hidden; touch-action:pan-y; backface-visibility: hidden; -webkit-backface-visibility: hidden; }
    .sc-active { transform:translate3d(0, 0, 0);    z-index:2; }
    .sc-prev   { transform:translate3d(0, -100%, 0); z-index:1; }
    .sc-next   { transform:translate3d(0, 100%, 0);  z-index:1; }

    /* Code hero */
    .sc-hero { flex-shrink:0; height:140px; background-color:#0d1117; border-bottom:1px solid rgba(255,255,255,0.06); position:relative; overflow:hidden; display:flex; align-items:flex-start; padding:1.1rem 1.2rem 0; }
    .sc-hero::after { content:''; position:absolute; inset:0; background:linear-gradient(180deg,rgba(10,14,19,0) 0%,rgba(10,14,19,0.3) 50%,rgba(10,14,19,0.95) 100%); pointer-events:none; }
    .sc-icon-badge { position:absolute; top:0.8rem; right:0.9rem; width:38px; height:38px; border-radius:50%; background:rgba(10,14,19,0.85); border:1px solid rgba(255,255,255,0.1); display:flex; align-items:center; justify-content:center; font-size:1.2rem; z-index:2; backdrop-filter:blur(6px); }
    .sc-status { position:absolute; bottom:0.65rem; left:0.9rem; z-index:2; }

    /* Card body — clips text but leaves space for footer + hint at bottom */
    .sc-body { flex:1; padding:0.85rem 1.1rem 0; display:flex; flex-direction:column; gap:0.65rem; overflow-y:auto; overflow-x:hidden; min-height:0; padding-bottom: 90px; scroll-behavior:smooth; -webkit-overflow-scrolling:touch; scrollbar-width:thin; scrollbar-color:rgba(104,160,99,0.3) transparent; }
    .sc-body::-webkit-scrollbar { width:3px; }
    .sc-body::-webkit-scrollbar-track { background:transparent; }
    .sc-body::-webkit-scrollbar-thumb { background:rgba(104,160,99,0.3); border-radius:3px; }
    .sc-track-row { display:flex; align-items:center; justify-content:space-between; flex-shrink:0; }
    .sc-track-lbl { font-size:0.72rem; font-weight:800; text-transform:uppercase; letter-spacing:0.07em; color:var(--node-green); }
    .sc-lesson-num { font-size:0.7rem; font-weight:700; color:var(--text-muted); background:rgba(255,255,255,0.05); border:1px solid var(--border); border-radius:4px; padding:0.12rem 0.4rem; }
    .sc-title { font-size:1.25rem; font-weight:800; color:var(--text-primary); line-height:1.3; margin:0; flex-shrink:0; }
    .sc-theory { font-size:0.95rem; color:var(--text-secondary); line-height:1.7; margin:0; flex-shrink:0; }

    /* Rich expanded content sections inside card */
    .sc-details { margin-top:0.5rem; flex-shrink:0; }
    .sc-details h4 { font-size:0.82rem; font-weight:800; color:var(--node-green); text-transform:uppercase; letter-spacing:0.07em; margin:0 0 0.5rem; }
    .sc-details ul { list-style:none; padding:0; margin:0; display:flex; flex-direction:column; gap:0.4rem; }
    .sc-details ul li { font-size:0.88rem; color:#a8b5c2; line-height:1.55; padding-left:1.1rem; position:relative; }
    .sc-details ul li::before { content:'→'; position:absolute; left:0; color:var(--node-green); font-size:.8rem; }
    .sc-code-block { background:#0d1117; border:1px solid rgba(255,255,255,0.07); border-radius:8px; overflow:hidden; margin-top:0.5rem; flex-shrink:0; }
    .sc-code-block pre { margin:0; padding:1rem 1.1rem; overflow-x:hidden; white-space:pre-wrap; word-break:break-word; word-wrap:break-word; font-family:var(--font-mono); font-size:.82rem; line-height:1.6; color:#e6edf3; }
    .sc-code-label { padding:0.4rem 1rem; background:#161b22; border-bottom:1px solid rgba(255,255,255,0.06); font-family:var(--font-mono); font-size:.75rem; color:var(--text-muted); }
    .sc-tip-box { background:rgba(104,160,99,0.07); border:1px solid rgba(104,160,99,0.2); border-left:3px solid var(--node-green); border-radius:8px; padding:0.75rem 1rem; margin-top:0.5rem; flex-shrink:0; }
    .sc-tip-box strong { font-size:0.78rem; color:var(--node-green); text-transform:uppercase; letter-spacing:0.05em; }
    .sc-tip-box p { font-size:0.88rem; color:#b8c4ce; line-height:1.55; margin:0.3rem 0 0; }

    /* Footer — pinned absolutely to the card bottom, always visible */
    .sc-footer {
      position: absolute;
      bottom: 28px; /* leave space for swipe hint */
      left: 0;
      right: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.65rem 1.1rem;
      border-top: 1px solid var(--border);
      background: var(--bg-dark);
      z-index: 3;
    }
    .sc-meta-row { display:flex; align-items:center; gap:0.5rem; flex-wrap:wrap; }
    .sc-time { font-size:0.78rem; color:var(--text-muted); }
    .sc-open-btn { background:var(--node-green); color:#fff; border:none; padding:0.45rem 1rem; font-size:0.85rem; font-weight:700; border-radius:var(--radius-sm); cursor:pointer; font-family:var(--font-sans); transition:background 0.2s,transform 0.15s; white-space:nowrap; flex-shrink:0; }
    .sc-open-btn:hover { filter:brightness(1.1); transform:translateY(-1px); }
    .sc-open-btn:active { transform:scale(0.96); }

    /* Right dots rail */
    .sc-dots-rail { position:absolute; right:6px; top:50%; transform:translateY(-50%); display:flex; flex-direction:column; gap:3px; z-index:5; }
    .sc-dot { width:15px; height:15px; padding:5px; box-sizing:border-box; border-radius:50%; background:rgba(255,255,255,0.15); background-clip:content-box; transition:all 0.3s; flex-shrink:0; cursor:pointer; }
    .sc-dot:hover { background:rgba(255,255,255,0.45); background-clip:content-box; }
    .sc-dot-cur { background:var(--node-green); background-clip:content-box; height:26px; border-radius:5px; }
    .sc-dot-cur:hover { background:var(--node-green); background-clip:content-box; }
    .sc-dot-done { background:rgba(104,160,99,0.42); background-clip:content-box; }
    .sc-dot-done:hover { background:rgba(104,160,99,0.85); background-clip:content-box; }

    /* Swipe hint — pinned absolutely at the very bottom of the card */
    .sc-swipe-hint {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 0.72rem;
      color: rgba(255,255,255,0.22);
      letter-spacing: 0.06em;
      padding: 0.25rem 0;
      background: var(--bg-dark);
      border-top: 1px solid rgba(255,255,255,0.04);
      z-index: 3;
    }

    /* Status & level badges */
    .s-done{background:rgba(104,160,99,0.12);color:var(--node-green)}
    .s-cur{background:rgba(0,212,170,0.1);color:var(--accent-cyan)}
    .s-new{background:rgba(255,255,255,0.05);color:var(--text-muted)}
    .sbadge{font-size:0.72rem;font-weight:700;padding:0.22rem 0.6rem;border-radius:99px;text-transform:uppercase;letter-spacing:0.04em;white-space:nowrap}
    .bg{background:rgba(104,160,99,.12);color:var(--node-green)}
    .bi{background:rgba(0,212,170,.1);color:var(--accent-cyan)}
    .ba{background:rgba(124,58,237,.12);color:#a78bfa}
    .lbadge{font-size:.72rem;font-weight:700;padding:.2rem .5rem;border-radius:99px;flex-shrink:0;text-transform:uppercase;letter-spacing:.04em}

    /* ══════════════════════════════════════════
       LESSON DETAIL VIEW (sv mode – unchanged)
    ══════════════════════════════════════════ */
    #view-content{
      display:none;
      flex-direction:column;
      flex:1;
      overflow-y: auto;
      min-height: calc(var(--real-vh, 100vh) - 60px);
      min-height: calc(100dvh - 60px);
      padding-bottom: 5rem;
    }
    .pdr{display:flex;align-items:center;justify-content:center;gap:2px;padding:.6rem 1rem;flex-shrink:0}
    .pd{width:18px;height:18px;padding:6px;box-sizing:border-box;border-radius:50%;background:rgba(255,255,255,.15);background-clip:content-box;transition:all .25s ease;cursor:pointer;flex-shrink:0}
    .pd:hover{background:rgba(255,255,255,.45);background-clip:content-box}
    .pd.cur{width:28px;background:var(--node-green);background-clip:content-box;border-radius:9px}
    .pd.cur:hover{background:var(--node-green);background-clip:content-box}
    .pd.done{background:rgba(104,160,99,.45);background-clip:content-box}
    .pd.done:hover{background:rgba(104,160,99,.85);background-clip:content-box}
    .lcard{margin:0 .75rem;background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-md);overflow:hidden;flex-shrink:0}
    .lts-hero { height: 180px; position: relative; background-size: cover; background-position: center; border-bottom: 1px solid var(--border); }
    .lts-hero::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(10,14,19,0) 0%, rgba(10,14,19,0.3) 60%, var(--bg-card) 100%); }
    .lts{padding:1.4rem 1.2rem 1.1rem;border-bottom:1px solid var(--border)}
    .lts h3{font-size:1.35rem;font-weight:800;color:var(--text-primary);margin-bottom:.7rem;line-height:1.35}
    .lts p{font-size:1.02rem;color:#d1d9e3;line-height:1.72;margin-bottom:1rem}
    .lts ul{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:.45rem}
    .lts ul li{font-size:0.95rem;color:#a8b5c2;line-height:1.6;padding-left:1.15rem;position:relative}
    .lts ul li::before{content:'\2192';position:absolute;left:0;color:var(--node-green);font-size:.85rem}
    .lcs{background:#0d1117}
    .lch{display:flex;align-items:center;justify-content:space-between;padding:.55rem 1.1rem;background:#161b22;border-bottom:1px solid rgba(255,255,255,.06)}
    .lch span{font-family:var(--font-mono);font-size:.82rem;color:var(--text-muted)}
    .bcopy{padding:.25rem .75rem;font-size:.78rem;font-weight:600;color:var(--node-green);background:rgba(104,160,99,.1);border:1px solid rgba(104,160,99,.2);border-radius:6px;cursor:pointer;transition:all .2s}
    .bcopy:hover{background:rgba(104,160,99,.2)}
    .lcs pre{margin:0;padding:1.1rem 1.2rem;overflow-x:hidden;white-space:pre-wrap;word-break:break-word;word-wrap:break-word;font-family:var(--font-mono);font-size:.92rem;line-height:1.65}
    .lbn{display:flex;align-items:center;justify-content:space-between;padding:.85rem .75rem;gap:.45rem;margin-top:auto;margin-bottom:4.5rem}
    .bln{display:inline-flex;align-items:center;gap:.3rem;padding:.55rem .9rem;font-size:.92rem;font-weight:600;border-radius:var(--radius-sm);cursor:pointer;transition:all .2s;border:1px solid var(--border);background:rgba(255,255,255,.03);color:var(--text-secondary);flex:1;justify-content:center}
    .bln:hover:not(:disabled){border-color:rgba(255,255,255,.15);color:var(--text-primary);background:rgba(255,255,255,.06)}
    .bln:disabled{opacity:.22;cursor:not-allowed}
    .blnh{background:rgba(104,160,99,.08);border-color:rgba(104,160,99,.22);color:var(--node-green);flex:.85}
    .blnh:hover{background:rgba(104,160,99,.15)!important;border-color:rgba(104,160,99,.4)!important}
    body.sv #view-list{display:none!important}
    body.sv #view-content{display:flex!important}
    body:not(.sv) #view-list{display:flex!important;flex-direction:column!important}
    body:not(.sv) #view-content{display:none!important}

    /* Vertical swipe animation for lesson content view */
    #view-content {
      position: fixed;
      top: 56px; /* below navbar */
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 480px;
      bottom: 60px;
      overflow-y: auto;
      overflow-x: hidden;
      display: none;
      flex-direction: column;
      padding-bottom: 0 !important;
    }
    body.sv #view-content { display: flex !important; }

    /* Bottom nav bar for lesson content - sticky at bottom */
    .lbn {
      position: sticky;
      bottom: 0;
      background: var(--bg-dark);
      border-top: 1px solid var(--border);
      z-index: 50;
      margin-bottom: 0 !important;
      padding: 0.75rem !important;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.45rem;
      flex-shrink: 0;
    }

    /* Desktop Viewport Enhancement: Make content full pageview */
    @media (min-width: 901px) {
      #view-content {
        max-width: 1000px;
        bottom: 0;
      }
      .lts-hero {
        height: 300px;
      }
      .lts {
        padding: 2.5rem 3.5rem 2rem;
      }
      .lts h3 {
        font-size: 1.8rem;
        margin-bottom: 1rem;
      }
      .lts p {
        font-size: 1.1rem;
        line-height: 1.8;
      }
      .lts ul li {
        font-size: 1.05rem;
      }
      .lch {
        padding: 1rem 3.5rem;
      }
      .lcs pre {
        padding: 2rem 3.5rem;
        font-size: 0.98rem;
      }
      .lbn {
        justify-content: center;
        gap: 2rem;
        padding: 1.2rem !important;
      }
      .bln {
        flex: none !important;
        width: 180px;
      }
    }
  </style>

<body>
  <!-- amp ads -->
  <amp-auto-ads type="adsense" data-ad-client="ca-pub-4242865347895866"></amp-auto-ads>

  <div class="app-container">
    <!-- Auth elements (hidden, used by Firebase) -->
    <div style="display:none;">
      <button id="auth-trigger-btn"></button>
      <div id="user-panel">
        <div id="user-avatar"></div>
        <button id="sign-out-btn"></button>
      </div>
    </div>
    <div class="lesson-tabs-wrap" style="display:none !important;"><div class="lesson-tabs" id="lesson-tabs"></div></div>
    <div id="view-list">
      <!-- Track filter tab strip -->
      <div class="track-filter-strip" id="track-filter-strip">
        <button class="tft active" data-filter="all">🌐 All</button>
        <button class="tft" data-filter="core">🌱 Core</button>
        <button class="tft" data-filter="web">🚂 Express</button>
        <button class="tft" data-filter="db-auth">🗄️ DB & Auth</button>
        <button class="tft" data-filter="devops-test">🧪 Testing</button>
      </div>
      <!-- Progress header -->
      <div class="lh">
        <h2>Node.js Lessons</h2>
        <p>14 lessons &middot; Beginner to Advanced</p>
        <div class="pbw"><div class="pbf" id="lpf" style="width:0%"></div></div>
        <div class="plabel" id="lpl">0 / 14 completed</div>
      </div>
      <!-- Swipe cards injected by JS -->
      <div class="swipe-container" id="llc" style="touch-action: none; position: relative; overflow: hidden; height: 100%; width: 100%;">
        <div class="slider-track" id="slider-track">
          <div class="slide" id="slide-left"></div>
          <div class="slide" id="slide-center"></div>
          <div class="slide" id="slide-right"></div>
        </div>
      </div>
    </div>
    <div id="view-content">
      <div id="desktop-lessons-sidebar" class="desktop-only-sidebar"></div>
      <div id="lesson-detail-main-col" style="display: flex; flex-direction: column; flex: 1; min-width: 0; overflow-y: auto;">
        <div class="pdr" id="pdr"></div>
        <div class="lcard" id="lci"></div>
        <div class="lbn">
          <button class="bln" id="bp">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="13" height="13"><polyline points="15 18 9 12 15 6"/></svg>Prev
          </button>
          <button class="bln blnh" id="bh">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="13" height="13"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>List
          </button>
          <button class="bln" id="bn">
            Next<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="13" height="13"><polyline points="9 18 15 12 9 6"/></svg>
          </button>
        </div>
      </div>
    </div>
    <div class="auth-modal-backdrop" id="auth-modal" role="dialog" aria-modal="true" aria-label="Authentication">
      <div class="auth-modal-card">
        <button class="auth-modal-close" id="auth-modal-close" aria-label="Close modal">&#x2715;</button>
        <div class="auth-logo">
          <svg class="logo-icon" viewBox="0 0 84 64" fill="none" stroke="currentColor" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" style="width:32px;height:22px;"><path d="M 16 52 L 16 26 C 16 17.5 22.5 11 30.5 11 C 38.5 11 45 17.5 45 26 L 45 42 C 45 48 49 53 56 53 C 63 53 67 48 67 42 C 67 36 63 32 56 32 C 49 32 45 28 45 22 C 45 16 49 11 56 11 C 63 11 67 16 67 22"/></svg>
          <span class="logo-text">next sem</span>
        </div>

  <script>
    // Fix: 100vh on mobile includes hidden browser chrome (address bar).
    // Measure the real visible height and expose it as --real-vh CSS var.
    (function() {
      function setRealVh() {
        var h = window.innerHeight;
        document.documentElement.style.setProperty('--real-vh', h + 'px');
        // Directly patch the view-list height too for instant effect
        var vl = document.getElementById('view-list');
        if (vl) vl.style.height = (h - 60) + 'px';
      }
      setRealVh();
      window.addEventListener('resize', setRealVh);
      window.addEventListener('orientationchange', function() {
        setTimeout(setRealVh, 200);
      });
    })();
  </script>
