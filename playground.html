<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Playground - NextSem</title>
  <meta name="description" content="Write and run Node.js code exercises, and verify programming challenges directly in your browser." />
  
  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Playground - NextSem" />
  <meta property="og:description" content="Write and run Node.js code exercises, and verify programming challenges directly in your browser." />
  <meta property="og:image" content="https://nodejs-by-nextsem.web.app/icon-512.png" />
  <meta property="og:url" content="https://nodejs-by-nextsem.web.app/playground.html" />
  
  <!-- Twitter -->
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="Playground - NextSem" />
  <meta name="twitter:description" content="Write and run Node.js code exercises, and verify programming challenges directly in your browser." />
  <meta name="twitter:image" content="https://nodejs-by-nextsem.web.app/icon-512.png" />
  
  <!-- Canonical Link -->
  <link rel="canonical" href="https://nodejs-by-nextsem.web.app/playground.html" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css?v=39" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" sizes="192x192" href="icon-192.png" />
  <meta name="theme-color" content="#0a0e13" />
  <style>
    .playground-navbar { background: rgba(10, 14, 19, 0.96) !important; backdrop-filter: blur(15px); border-bottom: 1px solid var(--border); position: sticky !important; top: 0 !important; left: 0 !important; transform: none !important; width: 100% !important; max-width: 100% !important; z-index: 100; padding: 0 1rem !important; }
    .playground-navbar .nav-container { width: 100% !important; display: flex !important; align-items: center !important; justify-content: space-between !important; gap: 0 !important; height: 56px !important; position: relative; }
    .nav-back-btn { color: var(--text-secondary); display: inline-flex; align-items: center; justify-content: center; width: 36px; height: 36px; border-radius: 50%; background: rgba(255, 255, 255, 0.02); border: 1px solid var(--border); z-index: 2; text-decoration: none; cursor: pointer; transition: background 0.2s; }
    .nav-back-btn:hover { background: rgba(255, 255, 255, 0.06); color: var(--text-primary); }
    .nav-page-title { position: absolute; left: 50%; transform: translateX(-50%); font-size: 0.98rem; font-weight: 800; color: var(--text-primary); pointer-events: none; z-index: 1; white-space: nowrap; }
    .playground-navbar .nav-actions { display: flex; align-items: center; gap: 0.5rem; z-index: 2; }
    .playground-navbar .btn-auth { display: inline-flex; align-items: center; justify-content: center; width: 36px; height: 36px; border-radius: 50%; padding: 0; border: 1px solid var(--border); }
    
    #view-list { padding: 1.25rem 1rem 5rem; }
    .lh { text-align: center; margin-bottom: 1.5rem; }
    .lh h2 { font-size: 1.4rem; font-weight: 800; color: var(--text-primary); margin-bottom: 0.35rem; }
    .lh p { font-size: 0.83rem; color: var(--text-secondary); }
    
    .playground-section-lbl { font-size: 0.68rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-muted); padding: 1.25rem 0 0.45rem; display: flex; align-items: center; gap: 0.5rem; }
    .playground-section-lbl::after { content: ''; flex: 1; height: 1px; background: var(--border); }
    
    .pli { display: flex; align-items: center; justify-content: space-between; gap: 0.9rem; padding: 0.9rem 1rem; background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-md); margin-bottom: 0.55rem; cursor: pointer; transition: all 0.2s, transform 0.15s; position: relative; overflow: hidden; }
    .pli::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: linear-gradient(180deg, var(--node-green), var(--accent-cyan)); opacity: 0; transition: opacity 0.2s; }
    .pli:hover { border-color: var(--border-hover); background: rgba(104, 160, 99, 0.04); transform: translateX(2px); }
    .pli:hover::before, .pli.cur::before { opacity: 1; }
    .pli.cur { border-color: rgba(104, 160, 99, 0.4); background: rgba(104, 160, 99, 0.06); }
    .plinfo { flex: 1; min-width: 0; }
    .pltitle { font-size: 0.88rem; font-weight: 600; color: var(--text-primary); line-height: 1.3; }
    .plstatus { font-size: 0.63rem; font-weight: 700; padding: 0.18rem 0.5rem; border-radius: 99px; text-transform: uppercase; letter-spacing: 0.04em; }
    .plstatus.solved { background: rgba(104, 160, 99, 0.12); color: var(--node-green); }
    .plstatus.unsolved { background: rgba(255, 255, 255, 0.05); color: var(--text-muted); }
    
    #view-content { display: none; flex-direction: column; flex: 1; min-height: calc(100vh - 56px); }
    .pdr { display: flex; align-items: center; justify-content: center; gap: 4px; padding: 0.6rem 1rem; }
    .pd { width: 6px; height: 6px; border-radius: 50%; background: rgba(255, 255, 255, 0.1); transition: all 0.3s; }
    .pd.cur { background: var(--node-green); width: 16px; border-radius: 3px; }
    .pd.done { background: rgba(104, 160, 99, 0.4); }
    
    .playground-detail-card { margin: 0 0.75rem 0.75rem; background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-md); overflow: hidden; }
    .pinfo-sec { padding: 1.3rem 1.2rem 1.1rem; border-bottom: 1px solid var(--border); }
    .pinfo-sec h3 { font-size: 1.1rem; font-weight: 800; color: var(--text-primary); margin-bottom: 0.6rem; line-height: 1.35; }
    .pinfo-sec p { font-size: 0.86rem; color: #d1d9e3; line-height: 1.65; white-space: pre-line; }
    
    .editor-section { background: #0d1117; display: flex; flex-direction: column; }
    .editor-subheader { display: flex; align-items: center; justify-content: space-between; padding: 0.55rem 1.1rem; background: #161b22; border-bottom: 1px solid rgba(255, 255, 255, 0.06); }
    .editor-subheader span { font-family: var(--font-mono); font-size: 0.75rem; color: var(--text-muted); }
    .code-editor { width: 100%; height: 280px; background: #0d1117; color: #e6edf3; border: none; outline: none; padding: 1rem 1.2rem; font-family: var(--font-mono); font-size: 0.81rem; line-height: 1.65; resize: none; border-bottom: 1px solid var(--border); }
    
    .playground-output { display: flex; flex-direction: column; background: #080c10; min-height: 150px; border-top: 1px solid var(--border); }
    .output-sec-header { display: flex; align-items: center; justify-content: space-between; padding: 0.5rem 1rem; background: rgba(255, 255, 255, 0.02); border-bottom: 1px solid rgba(255, 255, 255, 0.04); }
    .output-sec-header span { font-size: 0.72rem; font-weight: 700; text-transform: uppercase; color: var(--text-muted); }
    .btn-clear-out { background: none; border: none; color: var(--text-muted); font-size: 0.7rem; font-weight: 600; cursor: pointer; transition: color 0.2s; }
    .btn-clear-out:hover { color: var(--text-primary); }
    .output-sec-content { padding: 0.9rem 1.1rem; font-family: var(--font-mono); font-size: 0.78rem; line-height: 1.6; color: #c9d1d9; flex: 1; overflow-y: auto; max-height: 250px; }
    
    .output-log { color: #c9d1d9; }
    .output-error { color: #ff7b72; font-weight: 500; }
    .output-warn { color: #d29922; }
    .output-placeholder { color: #8b949e; font-style: italic; }
    
    .control-actions-row { display: flex; align-items: center; justify-content: space-between; padding: 0.8rem 1rem; background: var(--bg-card); border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); gap: 0.5rem; }
    .btn-run-action, .btn-verify-action, .btn-clear-action { display: inline-flex; align-items: center; justify-content: center; gap: 0.35rem; padding: 0.5rem 0.8rem; font-size: 0.78rem; font-weight: 700; border-radius: var(--radius-sm); cursor: pointer; transition: all 0.2s; border: 1px solid var(--border); }
    .btn-run-action { background: rgba(104, 160, 99, 0.08); border-color: rgba(104, 160, 99, 0.25); color: var(--node-green); flex: 1; }
    .btn-run-action:hover { background: rgba(104, 160, 99, 0.16); border-color: var(--node-green); }
    .btn-verify-action { background: var(--node-green); border-color: var(--node-green); color: #fff; display: none; flex: 1.2; box-shadow: 0 2px 8px rgba(104, 160, 99, 0.3); }
    .btn-verify-action:hover { background: var(--node-green-light); box-shadow: 0 4px 12px rgba(104, 160, 99, 0.45); }
    .btn-clear-action { background: rgba(255, 255, 255, 0.02); color: var(--text-secondary); }
    .btn-clear-action:hover { color: var(--text-primary); background: rgba(255, 255, 255, 0.05); }
    
    .playground-nav-row { display: flex; align-items: center; justify-content: space-between; padding: 0.85rem 0.75rem; gap: 0.45rem; margin-top: auto; }
    .pbtn { display: inline-flex; align-items: center; gap: 0.3rem; padding: 0.55rem 0.9rem; font-size: 0.81rem; font-weight: 600; border-radius: var(--radius-sm); cursor: pointer; transition: all 0.2s; border: 1px solid var(--border); background: rgba(255, 255, 255, 0.03); color: var(--text-secondary); flex: 1; justify-content: center; }
    .pbtn:hover:not(:disabled) { border-color: rgba(255, 255, 255, 0.15); color: var(--text-primary); background: rgba(255, 255, 255, 0.06); }
    .pbtn:disabled { opacity: 0.22; cursor: not-allowed; }
    .pbtn-home { background: rgba(104, 160, 99, 0.08); border-color: rgba(104, 160, 99, 0.22); color: var(--node-green); flex: 0.85; }
    .pbtn-home:hover { background: rgba(104, 160, 99, 0.15) !important; border-color: rgba(104, 160, 99, 0.4) !important; }
    
    /* Side navigation arrows (su: prev/up / sd: next/down) - vertical */
    .sarr { position: fixed; left: 50%; transform: translateX(-50%); width: 44px; height: 44px; border-radius: 50%; background: rgba(10, 14, 19, 0.9); border: 1px solid rgba(255, 255, 255, 0.12); color: #fff; display: none; align-items: center; justify-content: center; cursor: pointer; z-index: 300; box-shadow: 0 4px 18px rgba(0, 0, 0, 0.55); transition: all 0.2s; backdrop-filter: blur(10px); }
    .sarr:hover:not(:disabled) { background: var(--node-green); border-color: var(--node-green); box-shadow: 0 0 20px rgba(104, 160, 99, 0.45); }
    .sarr:disabled { opacity: 0.15; cursor: not-allowed; }
    #su { top: 64px; }
    #sd { bottom: 16px; }
    
    body.pv #view-list { display: none !important; }
    body.pv #view-content { display: flex !important; }
    body.pv .sarr { display: inline-flex !important; }
    body:not(.pv) #view-list { display: block !important; }
    body:not(.pv) #view-content { display: none !important; }
    body:not(.pv) .sarr { display: none !important; }
    
    /* Onboard Vertical Swipe Hint Toast */
    #swipe-hint-v {
      position: fixed;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      background: rgba(10, 14, 19, 0.92);
      border: 1px solid rgba(104, 160, 99, 0.3);
      border-radius: var(--radius-lg);
      padding: 1.5rem 1.25rem;
      width: 250px;
      text-align: center;
      box-shadow: 0 8px 32px rgba(0,0,0,0.6);
      z-index: 500;
      pointer-events: none;
      animation: swipeHintVFade 3.5s ease forwards;
    }
    .swipe-hint-icon {
      font-size: 2.2rem;
      margin-bottom: 0.8rem;
      display: inline-block;
      animation: bounceUpDown 1.2s infinite;
    }
    .swipe-hint-title {
      font-size: 0.88rem;
      font-weight: 800;
      color: var(--text-primary);
      margin-bottom: 0.3rem;
    }
    .swipe-hint-desc {
      font-size: 0.74rem;
      color: var(--text-secondary);
      line-height: 1.4;
    }
    @keyframes swipeHintVFade {
      0% { opacity: 0; transform: translate(-50%, -42%); }
      15% { opacity: 1; transform: translate(-50%, -50%); }
      80% { opacity: 1; }
      100% { opacity: 0; transform: translate(-50%, -55%); }
    }
    @keyframes bounceUpDown {
      0%, 100% { transform: translateY(-4px); }
      50% { transform: translateY(4px); }
    }
    
    /* Tab controls inside Editor for Mobile view */
    .playground-editor-tabs { display: none; background: #161b22; border-bottom: 1px solid var(--border); }
    .pg-tab-btn { flex: 1; background: none; border: none; color: var(--text-secondary); font-size: 0.78rem; font-weight: 700; padding: 0.65rem 0; cursor: pointer; text-align: center; border-bottom: 2px solid transparent; }
    .pg-tab-btn.active { color: var(--node-green); border-bottom-color: var(--node-green); background: rgba(255, 255, 255, 0.01); }
    
    @media (max-width: 480px) {
      .playground-editor-tabs { display: flex; }
      .playground-output { border-top: none; }
      body.show-console-only .editor-section { display: none !important; }
      body.show-console-only .playground-output { display: flex !important; flex: 1; }
      body:not(.show-console-only) .playground-output { display: none !important; }
      body:not(.show-console-only) .editor-section { display: flex !important; }
    }
  </style>
</head>
<body>
  <div class="app-container">
    <nav class="navbar playground-navbar">
      <div class="nav-container">
        <button class="nav-back-btn" id="nav-back-btn" aria-label="Go back">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="18" height="18"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
        </button>
        <span class="nav-page-title" id="nav-title">Code Playground</span>
        <div class="nav-actions">
          <button class="btn-auth" id="auth-trigger-btn" aria-label="Sign in">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          </button>
          <div class="user-panel" id="user-panel" style="display:none;"><div class="user-avatar" id="user-avatar"></div></div>
        </div>
      </div>
    </nav>

    <!-- ── List View ── -->
    <div id="view-list">
      <div class="lh">
        <h2>Code Playground</h2>
        <p>Learn by doing &middot; 10 Examples &middot; 3 Challenges</p>
      </div>
      
      <div class="playground-section-lbl">🧪 Coding Challenges</div>
      <div id="clc"></div>

      <div class="playground-section-lbl">📖 JavaScript Examples</div>
      <div id="elc"></div>
    </div>

    <!-- ── Content/Editor View ── -->
    <div id="view-content">
      <div class="pdr" id="pdr"></div>
      
      <div class="playground-detail-card">
        <div class="pinfo-sec" id="pinfo-sec">
          <!-- Populated by JS -->
        </div>
        
        <!-- Mobile tab toggles (Editor vs Console) -->
        <div class="playground-editor-tabs">
          <button class="pg-tab-btn active" id="btn-show-code">Editor</button>
          <button class="pg-tab-btn" id="btn-show-console">Console</button>
        </div>

        <div class="editor-section">
          <div class="editor-subheader">
            <span id="editor-filename">script.js</span>
          </div>
          <textarea class="code-editor" id="code-editor" spellcheck="false" placeholder="// Write code here..."></textarea>
        </div>

        <div class="playground-output">
          <div class="output-sec-header">
            <span>Terminal Output</span>
            <button class="btn-clear-out" id="clear-out-btn">Clear</button>
          </div>
          <div class="output-sec-content" id="output-content">
            <span class="output-placeholder">Run code to see output here...</span>
          </div>
        </div>

        <div class="control-actions-row">
          <button class="btn-clear-action" id="clear-code-btn">Clear Code</button>
          <button class="btn-run-action" id="run-btn">
            <svg viewBox="0 0 24 24" fill="currentColor" width="13" height="13"><path d="M8 5v14l11-7z"/></svg>Run
          </button>
          <button class="btn-verify-action" id="verify-btn">
            <svg viewBox="0 0 24 24" fill="currentColor" width="13" height="13"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>Verify
          </button>
        </div>
      </div>

      <div class="playground-nav-row">
        <button class="pbtn" id="prev-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="13" height="13"><polyline points="15 18 9 12 15 6"/></svg>Prev
        </button>
        <button class="pbtn pbtn-home" id="home-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="13" height="13"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>List
        </button>
        <button class="pbtn" id="next-btn">
          Next<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="13" height="13"><polyline points="9 18 15 12 9 6"/></svg>
        </button>
      </div>
    </div>

    <!-- Auth Modal -->
    <div class="auth-modal-backdrop" id="auth-modal" role="dialog" aria-modal="true" aria-label="Authentication">
      <div class="auth-modal-card">
        <button class="auth-modal-close" id="auth-modal-close" aria-label="Close modal">&#x2715;</button>
        <div class="auth-logo">
          <svg class="logo-icon" viewBox="0 0 84 64" fill="none" stroke="currentColor" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" style="width:32px;height:22px;"><path d="M 16 52 L 16 26 C 16 17.5 22.5 11 30.5 11 C 38.5 11 45 17.5 45 26 L 45 42 C 45 48 49 53 56 53 C 63 53 67 48 67 42 C 67 36 63 32 56 32 C 49 32 45 28 45 22 C 45 16 49 11 56 11 C 63 11 67 16 67 22"/></svg>
          <span class="logo-text">next sem</span>
        </div>
        <p class="auth-tagline">Track your progress, save your journey.</p>
        <button class="google-sign-in-btn" aria-label="Sign in with Google">
          <svg viewBox="0 0 24 24" width="18" height="18"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
          Continue with Google
        </button>
        <div class="auth-divider"><span>or</span></div>
        <div class="auth-tabs">
          <button class="auth-tab active" id="auth-tab-login">Sign In</button>
          <button class="auth-tab" id="auth-tab-signup">Sign Up</button>
        </div>
        <div class="auth-error" id="auth-error" style="display:none;"></div>
        <div class="auth-success" id="auth-success" style="display:none;"></div>
        <form class="auth-form" id="auth-form-login" onsubmit="return false;">
          <div class="auth-field"><label for="login-email">Email</label><input type="email" id="login-email" placeholder="you@example.com" autocomplete="email"/></div>
          <div class="auth-field"><label for="login-password">Password</label><input type="password" id="login-password" placeholder="Your password" autocomplete="current-password"/></div>
          <button type="button" class="auth-submit-btn" id="login-btn">Sign In</button>
        </form>
        <form class="auth-form" id="auth-form-signup" style="display:none;" onsubmit="return false;">
          <div class="auth-field"><label for="signup-name">Full Name</label><input type="text" id="signup-name" placeholder="Your name" autocomplete="name"/></div>
          <div class="auth-field"><label for="signup-email">Email</label><input type="email" id="signup-email" placeholder="you@example.com" autocomplete="email"/></div>
          <div class="auth-field"><label for="signup-password">Password</label><input type="password" id="signup-password" placeholder="Min 6 characters" autocomplete="new-password"/></div>
          <div class="auth-field"><label for="signup-confirm">Confirm Password</label><input type="password" id="signup-confirm" placeholder="Repeat password" autocomplete="new-password"/></div>
          <button type="button" class="auth-submit-btn" id="signup-btn">Create Account</button>
        </form>
      </div>
    </div>
  </div>

  <!-- Vertical arrow navigation (su: swipe up / sd: swipe down) -->
  <button class="sarr" id="su" aria-label="Previous challenge">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="20" height="20"><polyline points="18 15 12 9 6 15"/></svg>
  </button>
  <button class="sarr" id="sd" aria-label="Next challenge">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="20" height="20"><polyline points="6 9 12 15 18 9"/></svg>
  </button>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-analytics-compat.js"></script>
  <script src="firebase.js?v=39"></script>
  <script src="confetti.js?v=39"></script>
  <script src="playground.js?v=39"></script>
  <script src="mobile-nav.js?v=39"></script>
</body>
</html>
